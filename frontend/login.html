<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LibraVerse | Login</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT BRAND SECTION -->

        <div class="auth-brand">

            <div class="brand-icon">
                📚
            </div>

            <h1>
                Libra<span>Verse</span>
            </h1>

            <p>
                Your smart and colorful digital library.
            </p>

            <div class="floating-books">
                📕 📗 📘 📙
            </div>

        </div>


        <!-- LOGIN SECTION -->

        <div class="auth-card">

            <div class="auth-header">

                <h2>
                    Welcome Back! 👋
                </h2>

                <p>
                    Login to continue to your library.
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="student@example.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    🔐 Login
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="auth-footer">

                <p>

                    Don't have an account?

                    <a href="/register">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="/auth.js"></script>

</body>

</html>
